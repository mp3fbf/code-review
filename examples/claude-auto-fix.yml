# Copie este arquivo para .github/workflows/claude-auto-fix.yml no seu repo
name: Claude Auto Fix

on:
  issue_comment:
    types: [created]

jobs:
  fix:
    # Só executa se:
    # 1. É um PR (não issue)
    # 2. Comentário é do Claude bot
    # 3. Contém "Pull Request Review"
    if: |
      github.event.issue.pull_request &&
      (github.event.comment.user.login == 'github-actions[bot]' ||
       github.event.comment.user.login == 'claude[bot]') &&
      contains(github.event.comment.body, 'Pull Request Review')

    uses: mp3fbf/code-review/.github/workflows/auto-apply-review.yml@main
    with:
      comment_body: ${{ github.event.comment.body }}
      pr_number: ${{ github.event.issue.number }}
      comment_user: ${{ github.event.comment.user.login }}
    secrets: inherit
