# Consensus Retry - Reusable Workflow
#
# Handles timeouts when one reviewer doesn't respond.
#
# Security: Only accepts pr_number (integer). All content fetched via API.
# No run: commands. No untrusted input interpolation.
#
# Timeout rules:
# - awaiting-ai-consensus-codex-processing: 30 min
# - awaiting-ai-consensus-codex-not-started: 5 min
# - awaiting-ai-consensus-claude: 15 min

name: Consensus Retry (Reusable)

on:
  workflow_call:
    inputs:
      pr_number:
        description: 'The PR number to check'
        required: true
        type: number

jobs:
  check-timeout:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      # Security: Only uses pr_number (integer) and fetches all content via API
      - name: Check timeout and post fallback if needed
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ inputs.pr_number }};

            const TIMEOUT_RULES = {
              'awaiting-ai-consensus-codex-processing': 30,
              'awaiting-ai-consensus-codex-not-started': 5,
              'awaiting-ai-consensus-claude': 15
            };

            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });

            const consensusLabel = labels.find(l => l.name.startsWith('awaiting-ai-consensus'));
            if (!consensusLabel) return;

            const timeoutMinutes = TIMEOUT_RULES[consensusLabel.name] || 15;

            const { data: events } = await github.rest.issues.listEvents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });

            const labelEvent = events
              .filter(e => e.event === 'labeled' && e.label.name === consensusLabel.name)
              .pop();

            if (!labelEvent) return;

            const ageMinutes = (new Date() - new Date(labelEvent.created_at)) / 60000;
            if (ageMinutes < timeoutMinutes) return;

            const missing = consensusLabel.name.includes('codex') ? 'codex' : 'claude';

            // Check if missing review arrived
            if (missing === 'codex') {
              const { data: reviews } = await github.rest.pulls.listReviews({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber
              });
              if (reviews.some(r => r.user.login === 'chatgpt-codex-connector[bot]' && r.body?.includes('Codex Review'))) {
                await github.rest.issues.removeLabel({ owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber, name: consensusLabel.name });
                return;
              }
            } else {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber
              });
              if (comments.some(c => c.user.login === 'claude[bot]' && c.body.includes('Claude finished'))) {
                await github.rest.issues.removeLabel({ owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber, name: consensusLabel.name });
                return;
              }
            }

            // Check if already posted timeout
            const { data: existingComments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });

            if (existingComments.some(c => c.user.login === 'github-actions[bot]' && c.body.includes('timeout'))) return;

            // Get present reviewer verdict
            let presentReviewer, presentVerdict;
            if (missing === 'codex') {
              presentReviewer = 'Claude';
              const claude = existingComments.filter(c => c.user.login === 'claude[bot]' && c.body.includes('Claude finished')).pop();
              presentVerdict = claude && (claude.body.includes('APPROVED') || claude.body.includes('Recommendation: MERGE')) ? 'Approved' : 'Issues Found';
            } else {
              presentReviewer = 'Codex';
              const { data: reviews } = await github.rest.pulls.listReviews({ owner: context.repo.owner, repo: context.repo.repo, pull_number: prNumber });
              const codex = reviews.filter(r => r.user.login === 'chatgpt-codex-connector[bot]' && r.body?.includes('Codex Review')).pop();
              const p1 = codex ? (codex.body.match(/!\[P1 Badge\]/g) || []).length : 0;
              presentVerdict = p1 > 0 ? p1 + ' P1 Issue(s)' : 'No P1 Issues';
            }

            const emoji = presentVerdict.includes('Approved') || presentVerdict.includes('No P1') ? '✅' : '⚠️';
            const missingCap = missing.charAt(0).toUpperCase() + missing.slice(1);

            const body = [
              '## ⏱️ AI Review Consensus: ' + presentReviewer.toUpperCase() + ' ONLY (timeout)',
              '', missingCap + ' did not respond within ' + timeoutMinutes + ' minutes.',
              '', '| Reviewer | Verdict |', '|----------|---------|',
              '| ' + presentReviewer + ' | ' + emoji + ' ' + presentVerdict + ' |',
              '| ' + missingCap + ' | ⏱️ Timed out |',
              '', '**Proceeding with ' + presentReviewer + "'s review only.**",
              '', '---', '*To request ' + missingCap + ' review: comment `@' + missing + ' review`*'
            ].join('\n');

            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber, body });
            await github.rest.issues.removeLabel({ owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber, name: consensusLabel.name });
