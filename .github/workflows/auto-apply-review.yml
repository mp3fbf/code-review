# Auto Apply Review Suggestions
#
# This workflow automatically applies AI code review suggestions.
# It triggers when the consensus workflow posts "AI Review Consensus".
#
# How it works:
# 1. Claude and Codex review the PR independently
# 2. consensus-review.yml waits for both and posts "AI Review Consensus"
# 3. This workflow triggers on that consensus comment
# 4. Claude Code applies the consolidated suggestions
# 5. Commits with [auto-fix] tag, loop until approval or 3 iterations
#
# Security: This workflow uses contains() for filtering only.
# No untrusted input is used in shell commands.
#
# Observability:
# - Posts comment when review is approved (nothing to fix)
# - Posts comment when starting to apply fixes
# - Posts comment when analyzed but no changes needed
# - Posts comment when max iterations reached

name: Auto Apply Review Suggestions

on:
  issue_comment:
    types: [created, edited]

jobs:
  apply-review:
    # Triggers when:
    # 1. Consensus workflow posts unified review with issues, OR
    # 2. Claude bot posts review directly (backward compatibility)
    # Security: contains() is used for filtering only, not in shell commands
    if: |
      github.event.issue.pull_request &&
      (
        (
          github.event.comment.user.login == 'github-actions[bot]' &&
          contains(github.event.comment.body, 'AI Review Consensus') &&
          contains(github.event.comment.body, 'CHANGES REQUESTED')
        ) ||
        (
          github.event.comment.user.login == 'claude[bot]' &&
          contains(github.event.comment.body, 'Claude finished') &&
          (contains(github.event.comment.body, 'Code Review') || contains(github.event.comment.body, 'Pull Request Review'))
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Get PR branch
        id: pr-info
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('branch', pr.data.head.ref);

      - name: Analyze review result
        id: analyze-review
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.comment.body;

            // Check if review approved the PR (nothing to fix)
            const isApproved = body.includes('APPROVED') ||
                              body.includes('Recommendation: MERGE') ||
                              body.includes('✅ **Overall Assessment: APPROVED**');

            // Check if there are actionable issues
            const hasSecurityIssues = body.includes('🔒') && body.includes('ISSUE');
            const hasBugs = body.includes('🐛') || (body.includes('Potential bugs') && !body.includes('No issues'));
            const hasWarnings = body.includes('⚠️') && !body.includes('Auto-fix limit');

            const hasActionableIssues = hasSecurityIssues || hasBugs || hasWarnings;

            console.log('Review analysis:', { isApproved, hasActionableIssues });

            core.setOutput('is_approved', isApproved ? 'true' : 'false');
            core.setOutput('has_issues', hasActionableIssues ? 'true' : 'false');

      - name: Check iteration count
        id: check-iterations
        uses: actions/github-script@v7
        with:
          script: |
            const commits = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            const autoFixCount = commits.data.filter(c =>
              c.commit.message.includes('[auto-fix]')
            ).length;
            console.log('Auto-fix iterations:', autoFixCount);
            if (autoFixCount >= 3) {
              core.setOutput('should_continue', 'false');
            } else {
              core.setOutput('should_continue', 'true');
              core.setOutput('iteration', String(autoFixCount + 1));
            }

      # OBSERVABILITY: Comment when review approved (nothing to fix)
      - name: Comment if review approved
        if: steps.analyze-review.outputs.is_approved == 'true' && steps.analyze-review.outputs.has_issues == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ **Auto-fix: Review approved, no fixes needed**\n\nThe review did not identify any issues that require automatic correction.'
            });

      - name: Post starting comment
        if: steps.check-iterations.outputs.should_continue == 'true' && steps.analyze-review.outputs.has_issues == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const iteration = '${{ steps.check-iterations.outputs.iteration }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '🔄 **Auto-fix iteration ' + iteration + '/3** - Applying review suggestions...'
            });

      - name: Checkout repository
        if: steps.check-iterations.outputs.should_continue == 'true' && steps.analyze-review.outputs.has_issues == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr-info.outputs.branch }}
          fetch-depth: 0

      - name: Configure git
        if: steps.check-iterations.outputs.should_continue == 'true' && steps.analyze-review.outputs.has_issues == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Apply Review Suggestions
        id: apply-fixes
        if: steps.check-iterations.outputs.should_continue == 'true' && steps.analyze-review.outputs.has_issues == 'true'
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "claude"  # Allow claude bot to trigger this action
          direct_prompt: |
            Apply the code review suggestions from the review comment on this PR.

            Focus on fixing:
            - Security issues (marked with warning symbols)
            - Potential bugs (marked with bug symbols)
            - Performance improvements that have code suggestions

            Skip:
            - Items already marked as good/done
            - Pure style suggestions
            - Test recommendations

            After applying fixes:
            1. Stage changes: git add -A
            2. Commit with message: fix: apply review suggestions [auto-fix]
            3. Include brief list of what was fixed in commit body

            If there's nothing actionable to fix, just say so.

      - name: Check for changes
        id: check-changes
        if: steps.check-iterations.outputs.should_continue == 'true' && steps.analyze-review.outputs.has_issues == 'true'
        run: |
          if git diff --quiet && git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Push changes
        if: steps.check-changes.outputs.has_changes == 'true'
        run: git push origin HEAD:${{ steps.pr-info.outputs.branch }}

      # OBSERVABILITY: Comment when no changes were made
      - name: Comment if no changes
        if: steps.check-iterations.outputs.should_continue == 'true' && steps.analyze-review.outputs.has_issues == 'true' && steps.check-changes.outputs.has_changes == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ **Auto-fix: Analyzed, no changes needed**\n\nReview suggestions were analyzed but did not result in code changes (may be optional suggestions or already implemented).'
            });

      - name: Comment if max iterations reached
        if: steps.check-iterations.outputs.should_continue == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '⚠️ **Auto-fix limit reached (3 iterations)**\n\nPlease review manually.'
            });
