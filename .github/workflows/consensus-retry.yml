# Consensus Retry Check
#
# This workflow runs periodically to check PRs waiting for AI consensus.
# It handles timeouts when one reviewer doesn't respond.
#
# Timeout rules:
# - awaiting-ai-consensus-codex-processing: 30 min (Codex started but not finished)
# - awaiting-ai-consensus-codex-not-started: 5 min (Codex never saw the PR)
# - awaiting-ai-consensus-claude: 15 min (Claude hasn't responded)
#
# Security: This workflow only uses actions/github-script for API calls.
# No shell commands are used with untrusted input.

name: Consensus Retry Check

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check-pending:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Check pending PRs and handle timeouts
        uses: actions/github-script@v7
        with:
          script: |
            const TIMEOUT_RULES = {
              'awaiting-ai-consensus-codex-processing': 30,
              'awaiting-ai-consensus-codex-not-started': 5,
              'awaiting-ai-consensus-claude': 15
            };

            const { data: pullRequests } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });

            console.log(`Found ${pullRequests.length} open PRs`);

            for (const pr of pullRequests) {
              const { data: labels } = await github.rest.issues.listLabelsOnIssue({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number
              });

              const consensusLabel = labels.find(l => l.name.startsWith('awaiting-ai-consensus'));

              if (!consensusLabel) {
                continue;
              }

              console.log(`PR #${pr.number} has label: ${consensusLabel.name}`);

              const timeoutMinutes = TIMEOUT_RULES[consensusLabel.name] || 15;

              const { data: events } = await github.rest.issues.listEvents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number
              });

              const labelEvent = events
                .filter(e => e.event === 'labeled' && e.label.name === consensusLabel.name)
                .pop();

              if (!labelEvent) {
                console.log(`No label event found for PR #${pr.number}, skipping`);
                continue;
              }

              const labeledAt = new Date(labelEvent.created_at);
              const now = new Date();
              const ageMinutes = (now - labeledAt) / 60000;

              console.log(`Label age: ${ageMinutes.toFixed(1)} min, timeout: ${timeoutMinutes} min`);

              if (ageMinutes < timeoutMinutes) {
                console.log(`PR #${pr.number}: Not yet timed out, skipping`);
                continue;
              }

              const missing = consensusLabel.name.includes('codex') ? 'codex' : 'claude';

              let reviewArrived = false;

              if (missing === 'codex') {
                const { data: reviews } = await github.rest.pulls.listReviews({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number
                });

                reviewArrived = reviews.some(r =>
                  r.user.login === 'chatgpt-codex-connector[bot]' &&
                  r.body && r.body.includes('Codex Review')
                );
              } else {
                const { data: comments } = await github.rest.issues.listComments({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number
                });

                reviewArrived = comments.some(c =>
                  c.user.login === 'claude[bot]' &&
                  c.body.includes('Claude finished')
                );
              }

              if (reviewArrived) {
                console.log(`PR #${pr.number}: Missing ${missing} review has arrived!`);
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  name: consensusLabel.name
                });
                continue;
              }

              console.log(`PR #${pr.number}: Timeout! Posting fallback for missing ${missing}`);

              const { data: existingComments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number
              });

              const alreadyPosted = existingComments.some(c =>
                c.user.login === 'github-actions[bot]' &&
                c.body.includes('AI Review Consensus') &&
                c.body.includes('timeout')
              );

              if (alreadyPosted) {
                console.log(`PR #${pr.number}: Timeout message already posted`);
                continue;
              }

              let presentReviewer, presentVerdict;

              if (missing === 'codex') {
                presentReviewer = 'Claude';
                const claudeComment = existingComments
                  .filter(c => c.user.login === 'claude[bot]')
                  .filter(c => c.body.includes('Claude finished'))
                  .pop();

                if (claudeComment) {
                  const body = claudeComment.body;
                  const isApproved = body.includes('APPROVED') ||
                                    body.includes('Recommendation: MERGE') ||
                                    body.includes('Overall Assessment: APPROVED') ||
                                    body.includes('Excellent Work');
                  presentVerdict = isApproved ? 'Approved' : 'Issues Found';
                } else {
                  presentVerdict = 'Unknown';
                }
              } else {
                presentReviewer = 'Codex';
                const { data: reviews } = await github.rest.pulls.listReviews({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number
                });

                const codexReview = reviews
                  .filter(r => r.user.login === 'chatgpt-codex-connector[bot]')
                  .filter(r => r.body && r.body.includes('Codex Review'))
                  .pop();

                if (codexReview) {
                  const p1Count = (codexReview.body.match(/!\[P1 Badge\]/g) || []).length;
                  presentVerdict = p1Count > 0 ? `${p1Count} P1 Issue(s)` : 'No P1 Issues';
                } else {
                  presentVerdict = 'Unknown';
                }
              }

              const missingCapitalized = missing.charAt(0).toUpperCase() + missing.slice(1);
              const presentEmoji = presentVerdict.includes('Approved') || presentVerdict.includes('No P1') ? '✅' : '⚠️';
              const recommendation = presentVerdict.includes('Approved') || presentVerdict.includes('No P1')
                ? 'Based on available review, this PR appears ready for merge.'
                : 'Based on available review, there are issues to address.';

              const commentBody = [
                `## ⏱️ AI Review Consensus: ${presentReviewer.toUpperCase()} ONLY (timeout)`,
                '',
                `${missingCapitalized} did not respond within ${timeoutMinutes} minutes.`,
                '',
                '| Reviewer | Verdict |',
                '|----------|---------|',
                `| ${presentReviewer} | ${presentEmoji} ${presentVerdict} |`,
                `| ${missingCapitalized} | ⏱️ Timed out |`,
                '',
                `**Proceeding with ${presentReviewer}'s review only.**`,
                '',
                `${presentEmoji} ${recommendation}`,
                '',
                '---',
                `*${missingCapitalized} may still respond later. This is an automated fallback.*`,
                `*To request ${missingCapitalized} review: comment \`@${missing} review\`*`
              ].join('\n');

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: commentBody
              });

              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                name: consensusLabel.name
              });

              console.log(`PR #${pr.number}: Posted timeout message and removed label`);
            }
